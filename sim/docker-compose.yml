# 給有 Docker 的環境用：在一個容器裡執行 sim/ 的同一批腳本，得到同樣的服務與埠。
# 只供開發與測試，不得用於正式環境。
#
#   啟動：docker compose -f sim/docker-compose.yml up -d --build
#   狀態：docker compose -f sim/docker-compose.yml exec sim sim/status.sh
#   停止：docker compose -f sim/docker-compose.yml down        （加 -v 連同資料一起刪）
#
# 設計說明：
# - 不為每個服務另外寫一份容器設定。容器掛載 repo，執行 sim/up.sh；服務清單、相依順序、
#   埠與版本都來自各服務目錄，新增服務目錄不需要改這個檔。
# - 使用主機網路：服務和本機直接執行時一樣只綁 127.0.0.1，位址以 sim/status.sh 的輸出為準。
#   Linux 的 Docker Engine 直接可用；Docker Desktop（macOS、Windows）要 4.34 以上，
#   並在 Settings → Resources → Network 開啟「Enable host networking」。
# - 執行期資料放在具名的 volume，不寫進 repo；repo 以唯讀掛載。
name: sgn-sim

services:
  sim:
    build:
      context: ./lib/container
    image: sgn-sim:dev
    network_mode: host
    # init：服務以背景行程執行，需要有行程回收結束的子行程。
    init: true
    environment:
      SIM_RUN_ROOT: /var/lib/sgn-sim
      # 第一次啟動要建置執行檔與安裝套件，健康檢查的等待時間放寬。
      SIM_HEALTH_TIMEOUT: "120"
    volumes:
      - ..:/workspace:ro
      - sim-run:/var/lib/sgn-sim
      - sim-go:/root/go
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  sim-run:
  sim-go:
